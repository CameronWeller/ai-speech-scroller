<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2740"/><stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb02e"/><stop offset="1" stop-color="#ffe27a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee6ff"/><stop offset="1" stop-color="#2b6cff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090b10" stop-opacity="0.95"/><stop offset="1" stop-color="#090b10" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <!-- lines already read: dim -->
  <rect x="20" y="20" width="62" height="9" rx="4.5" fill="#5b6470" opacity="0.75"/>
  <rect x="20" y="36" width="76" height="9" rx="4.5" fill="#5b6470" opacity="0.9"/>
  <!-- current line: glowing reading band with marker -->
  <rect x="20" y="53" width="64" height="16" rx="8" fill="#ffc43d" opacity="0.55" filter="url(#glow)"/>
  <rect x="20" y="55" width="64" height="12" rx="6" fill="url(#amber)"/>
  <rect x="9" y="52" width="4" height="18" rx="2" fill="#ffc43d"/>
  <!-- upcoming lines: bright then fading -->
  <rect x="20" y="78" width="70" height="9" rx="4.5" fill="#f2f2f2"/>
  <rect x="20" y="94" width="48" height="9" rx="4.5" fill="#f2f2f2" opacity="0.8"/>
  <rect x="20" y="108" width="60" height="9" rx="4.5" fill="#f2f2f2" opacity="0.45"/>
  <!-- voice -->
  <g fill="url(#wave)">
    <rect x="97" y="52" width="6" height="22" rx="3"/>
    <rect x="106" y="38" width="6" height="50" rx="3"/>
    <rect x="115" y="48" width="6" height="30" rx="3" opacity="0.85"/>
  </g>
</svg>
