app-id: io.github.CameronWeller.AiSpeechScroller
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ai-speech-scroller
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download:ro
modules:
  - name: ai-speech-scroller
    buildsystem: simple
    build-commands:
      - install -Dm755 pkg/ai-speech-scroller /app/bin/ai-speech-scroller
      - install -Dm644 lib/libvosk.so /app/bin/libvosk.so
      - install -Dm644 flatpak/io.github.CameronWeller.AiSpeechScroller.desktop /app/share/applications/io.github.CameronWeller.AiSpeechScroller.desktop
      - install -Dm644 flatpak/io.github.CameronWeller.AiSpeechScroller.svg /app/share/icons/hicolor/scalable/apps/io.github.CameronWeller.AiSpeechScroller.svg
      - install -Dm644 flatpak/io.github.CameronWeller.AiSpeechScroller.metainfo.xml /app/share/metainfo/io.github.CameronWeller.AiSpeechScroller.metainfo.xml
    sources:
      - type: dir
        path: ..
