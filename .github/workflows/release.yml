name: release
on:
  push:
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: npm test
      - run: scripts/fetch-assets.sh
      - name: Build all targets
        run: |
          v="${GITHUB_REF_NAME:-dev}"; mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" \
              -o "dist/ai-speech-scroller-$os-$arch$ext" .
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Build .deb packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          for a in amd64 arm64; do
            GOARCH=$a VERSION="${GITHUB_REF_NAME#v}" "$(go env GOPATH)/bin/nfpm" package -p deb -f nfpm.yaml -t dist/
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: "dist/*", generate_release_notes: true }
