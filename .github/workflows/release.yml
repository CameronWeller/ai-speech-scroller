name: release
on:
  push:
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libasound2-dev
      - run: scripts/fetch-assets.sh
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          v="${GITHUB_REF_NAME:-dev}"; mkdir -p dist pkg
          go build -trimpath -ldflags "-s -w -X main.version=$v" -o pkg/ai-speech-scroller .
          tar czf "dist/ai-speech-scroller-linux-amd64.tar.gz" -C pkg ai-speech-scroller -C ../lib libvosk.so -C .. LICENSE README.md
      - name: Build .deb
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          VERSION="${GITHUB_REF_NAME#v}" "$(go env GOPATH)/bin/nfpm" package -p deb -f nfpm.yaml -t dist/
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: "dist/*", generate_release_notes: true }
      - name: Publish signed apt repository (GitHub Pages)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get install -y dpkg-dev apt-utils gnupg
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git rev-parse --verify -q gh-pages >/dev/null; then git worktree add ../apt gh-pages; else git worktree add --orphan -b gh-pages ../apt; fi
          mkdir -p ../apt/pool ../apt/dists/stable/main/binary-amd64
          cp dist/*.deb ../apt/pool/
          cd ../apt
          dpkg-scanpackages --arch amd64 pool > dists/stable/main/binary-amd64/Packages
          gzip -9kf dists/stable/main/binary-amd64/Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=CameronWeller \
            -o APT::FTPArchive::Release::Label=ai-speech-scroller \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          gpg --batch --yes --pinentry-mode loopback --default-key "$KEY" -abs -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --default-key "$KEY" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --export --armor "$KEY" > ai-speech-scroller.asc
          touch .nojekyll
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -m "apt: ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages
