<!doctype html>
<meta charset="utf-8"><title>Speech Scroller display</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<body class="display">
<div id="viewport"><div id="text"></div><div id="readline"></div></div>
<div id="menu" hidden>
  <h2>Menu <small>(Esc to close)</small></h2>
  <button data-a="restart">Restart</button>
  <button data-a="back">◀ 5 words</button>
  <button data-a="fwd">5 words ▶</button>
  <button data-a="smaller">Text −</button>
  <button data-a="bigger">Text +</button>
  <button data-a="mirror">Mirror</button>
  <button data-a="listen">Pause / resume listening</button>
  <button data-a="fullscreen">Toggle fullscreen</button>
</div>
<script type="module" src="display.js"></script>
